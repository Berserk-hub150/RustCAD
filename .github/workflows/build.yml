name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo test --workspace --locked
      - run: cargo build -p rust-cad-desktop --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: rust-cad-${{ runner.os }}
          path: |
            target/release/rust-cad
            target/release/rust-cad.exe
